<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clearance Readback Trainer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Clearance Readback Trainer</h1>
      <div class="config-toggle">
        <span>Active config:</span>
        <button id="cfg28" class="cfg-btn">RWY 28</button>
        <button id="cfg10" class="cfg-btn">RWY 10</button>
      </div>
    </header>

    <section class="card">
      <div class="prompt-label">Prompt</div>
      <div id="promptText" class="prompt-text">Loading…</div>

      <form id="answerForm">
        <div class="field">
          <label for="answerBox">Callsign · Location code · Aircraft designator · Runway letter — press space to move to the next line, enter to submit</label>
          <textarea id="answerBox" class="terminal-box" rows="4" wrap="off"
            autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
        </div>
        <div class="actions">
          <button type="submit" id="submitBtn">Submit</button>
          <button type="button" id="nextBtn" style="display:none;">Next prompt</button>
        </div>
      </form>

      <div id="resultBox"></div>
    </section>
  </div>

<script src="script.js"></script>
</body>
</html>
